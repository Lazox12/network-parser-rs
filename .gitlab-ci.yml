stages:
  - test
  - publish

test:
  stage: test
  image: rust:latest
  script:
    - cargo build --verbose
    - cargo test --verbose

publish:
  stage: publish
  image: rust:latest
  rules:
    # Trigger this job automatically ONLY when a git tag is pushed
    - if: $CI_COMMIT_TAG
  script:
    # 1. Get the version from the Git tag.
    # The '#v' strips the 'v' prefix if you tag as 'v1.2.3' instead of '1.2.3'
    - VERSION=${CI_COMMIT_TAG#v}
    - echo "Preparing to publish version $VERSION"

    # 2. Install cargo-binstall and cargo-edit to get 'cargo set-version' fast
    - wget -O - https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz | tar -xz -C /usr/local/cargo/bin
    - cargo binstall cargo-edit -y

    # 3. Set the version for both crates.
    - cargo set-version -p network_parser_rs_macro $VERSION
    - cargo set-version -p network_parser_rs $VERSION

    # 4. Authenticate with crates.io
    - cargo login ${CARGO_REGISTRY_TOKEN}

    # 5. Publish the proc-macro crate first.
    # --allow-dirty is REQUIRED because we modified Cargo.toml without committing.
    - cargo publish -p network_parser_rs_macro --allow-dirty

    # 6. Wait for crates.io to update its registry index
    - sleep 15

    # 7. Publish the main wrapper crate
    - cargo publish -p network_parser_rs --allow-dirty